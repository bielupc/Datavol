# Esquema original de la petició: el que ens passa Caddy, o el nostre propi
# si algú entra directament al contenidor (desenvolupament local).
map $http_x_forwarded_proto $forwarded_scheme {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # L'API viu al contenidor "api".
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Darrere de Caddy (HTTPS). Conservem l'IP i l'esquema originals; sense
    # això l'API només veuria la IP de la xarxa interna de Docker i "http".
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Els PDFs poden pesar uns quants MB.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # GIFs i miniatures del catàleg, servits directament des del volum muntat.
  location /dataset/ {
    alias /usr/share/nginx/html/dataset/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Aplicació d'una sola pàgina: qualsevol ruta torna l'index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
