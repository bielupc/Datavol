services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym}
      POSTGRES_DB: ${POSTGRES_DB:-gym}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposat només per poder inspeccionar la base de dades des de l'amfitrió.
      # Lligat a 127.0.0.1: mai accessible des de fora de la màquina.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym} -d ${POSTGRES_DB:-gym}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD:-gym}@db:5432/${POSTGRES_DB:-gym}
      PORT: 3001
      DATASET_DIR: /dataset
      SEED_DIR: /seed
    ports:
      # Només per depurar des de l'amfitrió. El web hi arriba per la xarxa
      # interna de Docker (http://api:3001), no per aquest port.
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      # Dataset d'exercicis i PDFs originals, només lectura
      - ./data/exercises-dataset:/dataset:ro
      - ./1.pdf:/seed/1.pdf:ro
      - ./2.pdf:/seed/2.pdf:ro

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # En producció qui escolta cap enfora és Caddy (:80/:443), que fa de
      # reverse proxy cap aquí. Vegeu deploy/Caddyfile.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      # nginx serveix els GIFs i miniatures directament des d'aquí
      - ./data/exercises-dataset:/usr/share/nginx/html/dataset:ro

volumes:
  db-data:
